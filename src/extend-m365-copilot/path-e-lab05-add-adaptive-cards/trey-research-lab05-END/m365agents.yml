# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.10/yaml.schema.json
# Visit https://aka.ms/teamsfx-v5.0-guide for details on this file
# Visit https://aka.ms/teamsfx-actions for details on actions
version: v1.10

environmentFolderPath: ./env

# Triggered when 'teamsapp provision' is executed
provision:
  # Creates an app
  - uses: teamsApp/create
    with:
      # app name
      name: Trey-Research-${{APP_NAME_SUFFIX}}
    # Write the information of created resources into environment file for
    # the specified environment variable(s).
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  - uses: arm/deploy # Deploy given ARM templates parallelly.
    with:
      # AZURE_SUBSCRIPTION_ID is a built-in environment variable,
      # if its value is empty, TeamsFx will prompt you to select a subscription.
      # Referencing other environment variables with empty values
      # will skip the subscription selection prompt.
      subscriptionId: ${{AZURE_SUBSCRIPTION_ID}}
      # AZURE_RESOURCE_GROUP_NAME is a built-in environment variable,
      # if its value is empty, TeamsFx will prompt you to select or create one
      # resource group.
      # Referencing other environment variables with empty values
      # will skip the resource group selection prompt.
      resourceGroupName: ${{AZURE_RESOURCE_GROUP_NAME}}
      templates:
        - path: ./infra/azure.bicep # Relative path to this file
          # Relative path to this yaml file.
          # Placeholders will be replaced with corresponding environment
          # variable before ARM deployment.
          parameters: ./infra/azure.parameters.json
          # Required when deploying ARM template
          deploymentName: Create-resources-for-sme
      # Microsoft 365 Agents Toolkit will download this bicep CLI version from github for you,
      # will use bicep CLI in PATH if you remove this config.
      bicepCliVersion: v0.9.1

  - uses: script
    name: Grant deployer access to storage and seed database
    with:
      run: |
        $ErrorActionPreference = 'Continue'
        $storageAccountName = '${{STORAGE_ACCOUNT_NAME}}'
        $rgName = '${{AZURE_RESOURCE_GROUP_NAME}}'
        $subId = '${{AZURE_SUBSCRIPTION_ID}}'
        $scope = "/subscriptions/$subId/resourceGroups/$rgName/providers/Microsoft.Storage/storageAccounts/$storageAccountName"

        # Get deployer identity
        $oid = (az ad signed-in-user show --query id -o tsv).Trim()
        Write-Host "Deployer principal: $oid"

        # Step 1: Open network fully (publicNetworkAccess + defaultAction Allow)
        Write-Host "`n=== Step 1: Temporarily open storage network access ==="
        az storage account update --name $storageAccountName --resource-group $rgName --public-network-access Enabled --default-action Allow --only-show-errors | Out-Null

        # Step 2: Verify network state
        Write-Host "=== Step 2: Verifying storage account state ==="
        Start-Sleep -Seconds 5
        $state = az storage account show --name $storageAccountName --resource-group $rgName --query "{publicNetworkAccess:publicNetworkAccess, defaultAction:networkRuleSet.defaultAction}" -o json | ConvertFrom-Json
        Write-Host "  publicNetworkAccess: $($state.publicNetworkAccess)"
        Write-Host "  defaultAction: $($state.defaultAction)"

        # Step 3: Assign RBAC roles to deployer
        Write-Host "=== Step 3: Assign RBAC roles ==="
        $tableDataContributor = '0a9a7e1f-b9d0-4cc4-a60d-0319b160aaa3'
        $storageAccountContributor = '17d1049b-9a84-46fb-8f53-869881c3d3ab'
        az role assignment create --assignee-object-id $oid --assignee-principal-type User --role $tableDataContributor --scope $scope --only-show-errors 2>$null | Out-Null
        az role assignment create --assignee-object-id $oid --assignee-principal-type User --role $storageAccountContributor --scope $scope --only-show-errors 2>$null | Out-Null
        Write-Host "  Storage Table Data Contributor + Storage Account Contributor assigned."

        # Step 4: Wait and verify access with a test call
        Write-Host "=== Step 4: Waiting for propagation and testing access ==="
        $token = (az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
        $testHeaders = @{
            'Authorization' = "Bearer $token"
            'x-ms-version'  = '2020-12-06'
            'Accept'        = 'application/json;odata=nometadata'
        }
        $tableUrl = "https://$storageAccountName.table.core.windows.net/Tables"
        $maxRetries = 24
        $retryCount = 0
        $success = $false
        while (-not $success -and $retryCount -lt $maxRetries) {
            $retryCount++
            Write-Host "  Attempt $retryCount of $maxRetries..."
            try {
                $result = Invoke-RestMethod -Uri $tableUrl -Method GET -Headers $testHeaders -ErrorAction Stop
                Write-Host "  Access confirmed! Found $($result.value.Count) tables."
                $success = $true
            } catch {
                $statusCode = $_.Exception.Response.StatusCode.value__
                Write-Host "  Got HTTP $statusCode - waiting 10 seconds..."
                Start-Sleep -Seconds 10
                # Refresh token in case it expired
                $token = (az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
                $testHeaders['Authorization'] = "Bearer $token"
            }
        }
        if (-not $success) { throw "Failed to access storage after $maxRetries attempts" }

        # Step 5: Run database setup
        Write-Host "=== Step 5: Running database setup ==="
        $env:AZURE_TENANT_ID = (az account show --query tenantId -o tsv).Trim()
        node db-setup.js $storageAccountName

        # Step 6: Restore secure state (Function App uses private endpoints)
        Write-Host "=== Step 6: Restoring storage security ==="
        az storage account update --name $storageAccountName --resource-group $rgName --default-action Deny --public-network-access Disabled --only-show-errors | Out-Null
        Write-Host "  publicNetworkAccess: Disabled, defaultAction: Deny"
        Write-Host "Done."
      workingDirectory: scripts

  # Build app package with latest env value
  - uses: teamsApp/zipAppPackage
    with:
      # Path to manifest template
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  # Apply the app manifest to an existing app in
  # Developer Portal.
  # Will use the app id in manifest file to determine which app to update.
  - uses: teamsApp/update
    with:
      # Relative path to this file. This is the path for built zip file.
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Extend your app to Outlook and the Microsoft 365 app
  - uses: teamsApp/extendToM365
    with:
      # Relative path to the build app package.
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: ${{AGENT_SCOPE}}
    # Write the information of created resources into environment file for
    # the specified environment variable(s).
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
      shareLink: SHARE_LINK

# Triggered when 'teamsapp deploy' is executed
deploy:
  # Run npm command
  - uses: cli/runNpmCommand
    name: install dependencies
    with:
      args: install

  # Package and deploy to Azure Functions Flex Consumption using a ready-to-run zip.
  # Uses 'func pack' (Core Tools) to build, install production deps, honour .funcignore,
  # and produce the deployment zip — much faster than remote Oryx build and avoids
  # the silent Oryx failures when functionStorage is network-restricted.
  # Temporarily opens functionStorage so Kudu can write the package to the deployment
  # blob container, then restores secure defaults (Deny + private endpoints only).
  - uses: script
    name: Deploy to Azure Functions (Flex Consumption)
    with:
      run: |
        $ErrorActionPreference = 'Stop'
        $resId = '${{API_FUNCTION_RESOURCE_ID}}'
        $appName = ($resId -split '/')[-1]
        $rgName = '${{AZURE_RESOURCE_GROUP_NAME}}'
        $funcStorageName = '${{FUNCTION_STORAGE_NAME}}'

        # Step 1: Build a ready-to-run package with func pack (handles tsc + npm install)
        Write-Host "Packaging function app with 'func pack'..."
        Get-ChildItem -Path . -Filter '*.zip' -File | Remove-Item -Force -ErrorAction SilentlyContinue
        func pack 2>&1 | ForEach-Object { Write-Host $_ }
        if ($LASTEXITCODE -ne 0) { throw "func pack failed with exit code $LASTEXITCODE" }

        $zipFile = Get-ChildItem -Path . -Filter '*.zip' -File | Select-Object -First 1
        if (-not $zipFile) { throw "No zip produced by 'func pack'." }
        $zipPath = $zipFile.FullName
        $sizeMB = [math]::Round($zipFile.Length / 1MB, 2)
        Write-Host "Package: $($zipFile.Name) ($sizeMB MB)"

        # Step 2: Temporarily open functionStorage so Kudu can upload the package
        Write-Host "Opening functionStorage network for deployment..."
        az storage account update --name $funcStorageName --resource-group $rgName --public-network-access Enabled --default-action Allow --only-show-errors | Out-Null
        Start-Sleep -Seconds 8

        try {
          # Step 3: Deploy the ready-to-run zip (no remote build)
          Write-Host "Deploying to $appName..."
          $ErrorActionPreference = 'Continue'
          az functionapp deployment source config-zip --src $zipPath --name $appName --resource-group $rgName 2>&1 | ForEach-Object { Write-Host $_ }
          $deployExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'

          if ($deployExitCode -ne 0) { throw "Deployment failed with exit code $deployExitCode" }
          Write-Host "Deployment complete."
        } finally {
          # Step 4: Always restore secure state
          Write-Host "Restoring functionStorage security..."
          az storage account update --name $funcStorageName --resource-group $rgName --default-action Deny --public-network-access Disabled --only-show-errors | Out-Null
          Write-Host "  functionStorage locked: publicNetworkAccess=Disabled, defaultAction=Deny"
          Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
        }

# Triggered when 'teamsapp publish' is executed
publish:
  # Build app package with latest env value
  - uses: teamsApp/zipAppPackage
    with:
      # Path to manifest template
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build
  # Apply the app manifest to an existing app in
  # Developer Portal.
  # Will use the app id in manifest file to determine which app to update.
  - uses: teamsApp/update
    with:
      # Relative path to this file. This is the path for built zip file.
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
  # Publish the app to
  # Teams Admin Center (https://admin.teams.microsoft.com/policies/manage-apps)
  # for review and approval
  - uses: teamsApp/publishAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
    # Write the information of created resources into environment file for
    # the specified environment variable(s).
    writeToEnvironmentFile:
      publishedAppId: TEAMS_APP_PUBLISHED_APP_ID
projectId: d0473445-a254-4475-a905-83ade91c5f7e
